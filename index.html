            { id: "t-25", day: "8/17", time: "PM 05:00", title: "中樂號茶莊 852Teahouse 재방문", desc: "다시 방문하여 깊은 차 이야기와 시음", icon: "🫖", bg: "bg-emerald-100 text-emerald-900", media: [] },
            { id: "t-26", day: "8/17", time: "PM 08:00", title: "저녁 식사 (한식당)", desc: "현지 한식당에서 저녁 식사", icon: "🍲", bg: "bg-amber-50 text-amber-800", media: [] },
            { id: "t-27", day: "8/17", time: "PM 11:00", title: "숙소 복귀 및 휴식", desc: "하루 마무리 후 숙소 휴식", icon: "🛌", bg: "bg-stone-100 text-stone-700", media: [] },
            { id: "t-28", day: "8/18", time: "AM 07:30", title: "기상", desc: "마지막 날 기상 및 짐 정리", icon: "☀️", bg: "bg-stone-100 text-stone-700", media: [] },
            { id: "t-29", day: "8/18", time: "AM 08:00", title: "홍콩식 아침 식사", desc: "차찬탱에서 홍콩식 차와 토스트 식사", icon: "🍞", bg: "bg-amber-50 text-amber-800", media: [] },
            { id: "t-30", day: "8/18", time: "AM 09:00", title: "월동자창 (Yuet Tung China Works)", desc: "까우룽베이 핸드페인트 도자기 공방 방문 및 차기 쇼핑", icon: "🎨", bg: "bg-purple-50 text-purple-800", media: [] },
            { id: "t-31", day: "8/18", time: "AM 11:00", title: "몽콕 도착 & 로컬 거리 구경", desc: "몽콕 번화가 및 거리 풍경 구경", icon: "🛍️", bg: "bg-emerald-50 text-emerald-800", media: [] },
            { id: "t-32", day: "8/18", time: "PM 12:30", title: "점심 식사 (우육면)", desc: "우육면으로 맛있는 점심 식사", icon: "🍜", bg: "bg-amber-50 text-amber-800", media: [] },
            { id: "t-33", day: "8/18", time: "PM 02:30", title: "SUM FONG TEA HOUSE 沁芳茶房 방문", desc: "삼수이포 찻집 탐방 및 차도구 구경", icon: "🫖", bg: "bg-emerald-100 text-emerald-900", media: [] },
            { id: "t-34", day: "8/18", time: "PM 06:30", title: "홍콩 국제공항 도착", desc: "공항 이동 및 출국 수속", icon: "🛫", bg: "bg-blue-50 text-blue-700", media: [] },
            { id: "t-35", day: "8/18", time: "PM 09:30", title: "홍콩익스프레스 귀국 탑승", desc: "홍콩(HKG) ➔ 인천(ICN) 출발", icon: "✈️", bg: "bg-blue-50 text-blue-700", media: [] },
            { id: "t-36", day: "8/19", time: "AM 02:00", title: "인천국제공항 도착", desc: "인천 도착 후 공항 노숙 후 첫차 대기", icon: "🏢", bg: "bg-stone-100 text-stone-700", media: [] },
            { id: "t-37", day: "8/19", time: "AM 06:30", title: "출근!", desc: "일상으로 복귀 및 직장 출근", icon: "💼", bg: "bg-rose-50 text-rose-800", media: [] }
        ];

        let selectedTimelineIdForMedia = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadTimelineMedia();
            renderSpots();
            renderTimeline('all');
        });

        // 타임라인 미디어는 브라우저 localStorage에 안전하게 유지
        function loadTimelineMedia() {
            const saved = localStorage.getItem('hk_tea_timeline_media');
            if (saved) {
                try {
                    const mediaMap = JSON.parse(saved);
                    timelineData.forEach(item => {
                        if (mediaMap[item.id]) {
                            item.media = mediaMap[item.id];
                        }
                    });
                } catch(e) {}
            }
        }

        function saveTimelineMedia() {
            const mediaMap = {};
            timelineData.forEach(item => {
                if (item.media && item.media.length > 0) {
                    mediaMap[item.id] = item.media;
                }
            });
            localStorage.setItem('hk_tea_timeline_media', JSON.stringify(mediaMap));
        }

        function renderSpots() {
            const container = document.getElementById('spots-grid');
            container.innerHTML = '';

            spotsData.forEach((spot) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-sm flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="relative w-full aspect-[3/4] bg-stone-100 overflow-hidden">
                            <img src="${spot.img}" alt="${spot.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-4">
                            <span class="inline-block text-[10px] font-semibold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-md mb-1.5">
                                ${spot.tag || '스팟'}
                            </span>
                            <h3 class="serif font-bold text-stone-900 text-base mb-1.5 leading-snug">${spot.name}</h3>
                            <p class="text-xs text-stone-600 leading-relaxed mb-3">${spot.desc}</p>
                        </div>
                    </div>
                    <div class="px-4 pb-4">
                        ${spot.map ? `
                            <a href="${spot.map}" target="_blank" rel="noopener noreferrer" class="block text-center text-xs bg-[#2a3630] active:bg-[#1c2520] text-white font-medium py-3 rounded-xl transition touch-btn flex items-center justify-center">
                                📍 구글 지도 연결
                            </a>
                        ` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tabName) {
            const sectionSpots = document.getElementById('section-spots');
            const sectionTimeline = document.getElementById('section-timeline');
            const navSpots = document.getElementById('nav-spots');
            const navTimeline = document.getElementById('nav-timeline');

            [navSpots, navTimeline].forEach(btn => btn?.classList.remove('active-tab'));

            if (tabName === 'spots') {
                sectionSpots.scrollIntoView({ behavior: 'smooth' });
                navSpots.classList.add('active-tab');
            } else if (tabName === 'timeline') {
                sectionTimeline.scrollIntoView({ behavior: 'smooth' });
                navTimeline.classList.add('active-tab');
            }
        }

        function renderTimeline(filterDayVal) {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            const items = filterDayVal === 'all' 
                ? timelineData 
                : timelineData.filter(item => item.day === filterDayVal);

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = "relative pl-8 group";

                let mediaHtml = '';
                if (item.media && item.media.length > 0) {
                    mediaHtml = `
                        <div class="relative w-full aspect-[3/4] bg-stone-900 rounded-xl overflow-hidden mt-3" id="slider-${item.id}">
                            <div class="absolute inset-0 flex items-center transition-transform duration-300 ease-out slider-track-${item.id}" style="display: flex;">
                                ${item.media.map((m, idx) => `
                                    <div class="w-full h-full shrink-0 relative flex items-center justify-center bg-black">
                                        ${m.type === 'video' ? `
                                            <video src="${m.url}" controls class="w-full h-full object-contain"></video>
                                        ` : `
                                            <img src="${m.url}" alt="media" class="w-full h-full object-cover">
                                        `}
                                        <button onclick="deleteTimelineMedia('${item.id}',${idx})" class="absolute top-2 right-2 bg-black/70 text-white text-[10px] px-2 py-1 rounded-md">삭제</button>
                                    </div>
                                `).join('')}
                            </div>
                            ${item.media.length > 1 ? `
                                <button onclick="slideMedia('${item.id}', -1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs">◀</button>
                                <button onclick="slideMedia('${item.id}', 1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs">▶</button>
                                <div class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full" id="indicator-${item.id}">
                                    1 / ${item.media.length}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="absolute left-1.5 top-0 w-6 h-6 rounded-full bg-[#2a3630] border-2 border-white text-white text-[10px] flex items-center justify-center shadow z-10">
                        ${item.icon}
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm space-y-2.5">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-xs font-bold px-2.5 py-1.5 rounded-lg ${item.bg} tracking-tight whitespace-nowrap">
                                📅 ${item.day} &nbsp;|&nbsp; ⏰ ${item.time}
                            </span>
                            <button onclick="triggerTimelineMediaUpload('${item.id}')" title="사진/동영상 추가" class="w-10 h-10 bg-emerald-50 text-emerald-800 font-medium rounded-xl border border-emerald-200 active:bg-emerald-100 transition flex items-center justify-center text-base shrink-0 touch-btn">
                                📷
                            </button>
                        </div>
                        <div>
                            <h4 class="font-bold text-stone-900 text-sm mb-1">${item.title}</h4>
                            <p class="text-xs text-stone-600 leading-relaxed">${item.desc}</p>
                        </div>
                        ${mediaHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.slideStates = {};
        function slideMedia(itemId, direction) {
            const item = timelineData.find(t => t.id === itemId);
            if (!item || !item.media) return;
            
            if (!window.slideStates[itemId]) window.slideStates[itemId] = 0;
            const maxIdx = item.media.length - 1;
            
            window.slideStates[itemId] += direction;
            if (window.slideStates[itemId] < 0) window.slideStates[itemId] = 0;
            if (window.slideStates[itemId] > maxIdx) window.slideStates[itemId] = maxIdx;

            const idx = window.slideStates[itemId];
            const track = document.querySelector(`.slider-track-${itemId}`);
            if (track) {
                track.style.transform = `translateX(-${idx * 100}%)`;
            }
            const indicator = document.getElementById(`indicator-${itemId}`);
            if (indicator) {
                indicator.innerText = `${idx + 1} / ${item.media.length}`;
            }
        }

        function triggerTimelineMediaUpload(id) {
            selectedTimelineIdForMedia = id;
            document.getElementById('global-timeline-media-input').click();
        }

        function handleTimelineMediaUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0 || !selectedTimelineIdForMedia) return;

            const targetItem = timelineData.find(t => t.id === selectedTimelineIdForMedia);
            if (!targetItem) return;

            if (!targetItem.media) targetItem.media = [];

            let processedCount = 0;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const isVideo = file.type.startsWith('video');
                    targetItem.media.push({
                        type: isVideo ? 'video' : 'image',
                        url: e.target.result
                    });
                    processedCount++;
                    if (processedCount === files.length) {
                        saveTimelineMedia();
                        renderTimeline(document.querySelector('.day-btn.bg-\\[\\#2a3630\\]')?.getAttribute('data-day') || 'all');
                        event.target.value = '';
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function deleteTimelineMedia(itemId, mediaIdx) {
            const item = timelineData.find(t => t.id === itemId);
            if (item && item.media) {
                item.media.splice(mediaIdx, 1);
                saveTimelineMedia();
                renderTimeline(document.querySelector('.day-btn.bg-\\[\\#2a3630\\]')?.getAttribute('data-day') || 'all');
            }
        }

        function filterDay(day) {
            document.querySelectorAll('.day-btn').forEach(btn => {
                if (btn.getAttribute('data-day') === day) {
                    btn.className = "day-btn bg-[#2a3630] text-white px-3.5 py-2 rounded-xl shrink-0 transition touch-btn flex items-center";
                } else {
                    btn.className = "day-btn bg-white border border-stone-300 text-stone-700 px-3.5 py-2 rounded-xl shrink-0 transition touch-btn flex items-center";
                }
            });
            renderTimeline(day);
        }
    </script>
</body>
</html>
